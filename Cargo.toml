[package]
name = "ploegtoolbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "The home for the Ploeg app family"
default-run = "ploegtoolbox"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
semver = "1"
directories = "6"
sysinfo = "0.37"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "system-proxy"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "wayland", "x11", "accesskit", "default_fonts"] }
egui_extras = { version = "=0.33.3", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
